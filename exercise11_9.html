<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>i am not a robot</title>
  <link href="css/style.css" rel="stylesheet">

  <style>
    .box {
      width: 100px;
      height: 100px;
      border: 1px solid black;
      background-color: white;

    }

    .red {
      background-color: red;
    }
  </style>
</head>

<body>


  <div class="box">1

    <div id="dragme" draggable="true">
      Drag me please!
    </div>

  </div>

  <div class="box">2

  </div>

  <script>

    let drag = document.getElementById("dragme");

    drag.addEventListener("dragstart", function () {
      /* let a =  event.target
       a.style.opacity = */

      drag.style.opacity = 0.6
    })

    drag.addEventListener("dragend", function () {
      drag.style.opacity = 1
    })

    let dropOff = document.querySelectorAll(".box");



    dropOff.forEach(x => {

      x.addEventListener("dragenter", function (event) {
        x.classList.add("red");
        console.log(event)
      })
      x.addEventListener("dragover", function (event) {
        event.preventDefault()

      })

      x.addEventListener("dragleave", function () {
        x.classList.remove("red");
      })

      x.addEventListener("drop", function (event) {
        x.appendChild(drag);
        event.preventDefault()
      })
    })


  </script>
</body>

</html>
