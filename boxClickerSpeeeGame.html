<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>game</title>
  <link href="css/style.css" rel="stylesheet">

  <style>
    .output {
      width: 500px;
      height: 500px;
      border: 1px solid black;
      margin: auto;
      text-align: center;
      position: relative;
    }

    .box {
      width: 50px;
      height: 50px;
      position: absolute;
      top: 50px;
      left: 20%;
      background-color: red;
    }

    .message {
      text-align: center;
      padding: 10px;
      font-size: 1.3em;
    }
  </style>
</head>

<body>

  <div class="output">

  </div>
  <div class="message">

  </div>

  <script>
    let output = document.querySelector(".output")
    let message = document.querySelector(".message")

    let newDiv = document.createElement("div")



    newDiv.classList.add("box")

    output.appendChild(newDiv)

    message.textContent = `Press to Start`

    let game = {
      timer: 0,
      start: null
    }

    function randGen(a) {

      let maxNumber = Math.floor((Math.random() * a))

      return maxNumber
    }

    newDiv.addEventListener("click", function () {
      newDiv.style.display = "none"

      game.timer = setTimeout(addBox, randGen(4000));



      if (game.start == null) {
        message.textContent = "Loading...."
      }
      else {

        let time = new Date().getTime()

        let result = (time - game.start) / 1000

        message.textContent = `It took you ${result} seconds to Click`
        game.start = null
      }


    })

    function addBox() {
      newDiv.textContent = "Click now"
      game.start = new Date().getTime()
      newDiv.style.display = "block";
      newDiv.style.top = randGen(450) + "px"
      newDiv.style.bottom = randGen(450) + "px"


    }



  </script>
</body>

</html>
