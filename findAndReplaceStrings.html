<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link href="css/style.css" rel="stylesheet">
</head>

<body>
  <div id="output">
    Complete Javascript Course
  </div>
  Search for:
  <input type="text" id="sText"><br>Replace with
  <input type="text" id="rText"> <br>
  <button type="">Replace</button>

  <script>

    let output = document.querySelector("#output")
    let sText = document.querySelector("#sText")

    let rText = document.querySelector("#rText")
    let button = document.querySelector("button")

    button.addEventListener("click", lookup)

    function lookup() {

      let s = output.textContent.trim()
      let rt = rText.value

      let regex = new RegExp(sText.value, "gi")

      if (s.match(regex)) {
        s = s.replace(regex, rt)
        output.textContent = s
      }
    }

  </script>

</body>

</html>
