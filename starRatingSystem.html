<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>starRatingSystem</title>
  <link href="css/style.css" rel="stylesheet">

  <style>
    .star ul {
      list-style-type: none;
      padding: 0;
    }

    .star {
      font-size: 2em;
      color: #ddd;
      display: inline-block;
    }

    .orange {
      color: orange;
    }

    .output {
      background-color: #ddd;
    }
  </style>
</head>

<body>


  <ul class="stars">

    <li class="star">&#10029</li>
    <li class="star">&#10029</li>
    <li class="star">&#10029</li>
    <li class="star">&#10029</li>
    <li class="star">&#10029</li>
  </ul>

  <div class="output">

  </div>

  <script>

    let star = document.querySelector(".stars")

    let stars = document.querySelectorAll(".star")

    let output = document.querySelector(".output")


    stars.forEach((x, index) => {

      x.value = index + 1

      x.addEventListener("click", starRate)


      function starRate(e) {
        console.log(e.target.value)


        stars.forEach((x, index) => {

          if (index < e.target.value) {
            x.classList.add("orange")

          }
          else {
            x.classList.remove("orange")
          }
        })

      }

    })
  </script>
</body>

</html>
