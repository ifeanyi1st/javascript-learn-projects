<body>

    <input type="text" name="last" value="">

  </form>

  <script>
    let form = document.querySelector("form");

    function checker(a) {

    }

    form.addEventListener("submit", function (e) {
      let error = false



      if (form.first.value === "") {
        error = true
        console.log("wrong")
      }
      if (form.last.value === "") {
        error = true
        console.log()
      }

      if (isNaN(form.age.value)) {
        error = true
      }
      else if (form.age.value >= 19) {

      }
      if (error === true) {
        e.preventDefault();
      }


    })
